<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Slideshow Viewer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

#viewer{
    position:relative;
    width:100vw;
    height:100vh;
}

#photo{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.navBtn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.45);
    color:white;
    font-size:32px;
    cursor:pointer;
    z-index:20;
}

.navBtn:hover{
    background:rgba(0,0,0,0.8);
}

#prevBtn{
    left:20px;
}

#nextBtn{
    right:20px;
}

#toolbar{
    position:absolute;
    top:20px;
    left:20px;
    z-index:20;
}

.iconBtn{
    width:64px;
    height:64px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.45);
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
}

.iconBtn:hover{
    background:rgba(0,0,0,0.8);
}

#counter{
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.45);
    color:white;
    padding:10px 15px;
    border-radius:8px;
    z-index:20;
}

#filename{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.45);
    color:white;
    padding:10px 15px;
    border-radius:8px;
    z-index:20;
    max-width:80%;
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

#slideshowIcon{
    line-height:1;
    user-select:none;
}
</style>

<!-- Generated by Python -->
<script src="photos.js"></script>

</head>
<body>

<div id="viewer">

    <img id="photo" alt="Photo">

    <button id="prevBtn" class="navBtn" title="Previous Photo">
        &#10094;
    </button>

    <button id="nextBtn" class="navBtn" title="Next Photo">
        &#10095;
    </button>

    <div id="toolbar">
        <button id="slideshowBtn"
                class="iconBtn"
                title="Start Slideshow">

            <span id="slideshowIcon">▶</span>

        </button>
    </div>

    <div id="counter"></div>

    <div id="filename"></div>

</div>

<script>

let currentIndex = 0;

let slideshowRunning = false;

let slideshowTimer = null;

/* slideshow speed in milliseconds */
const slideshowDelay = 3000;

const photo = document.getElementById("photo");
const filename = document.getElementById("filename");
const counter = document.getElementById("counter");
const slideshowBtn = document.getElementById("slideshowBtn");
const slideshowIcon = document.getElementById("slideshowIcon");

function showPhoto(index){

    if(!photos || photos.length === 0){

        filename.textContent = "No photos found";
        counter.textContent = "0 / 0";
        photo.removeAttribute("src");

        return;
    }

    currentIndex =
        (index + photos.length) % photos.length;

    const file = photos[currentIndex];

    photo.src = "photos/" + file;

    filename.textContent = file;

    counter.textContent =
        (currentIndex + 1) +
        " / " +
        photos.length;
}

function nextPhoto(){
    showPhoto(currentIndex + 1);
}

function previousPhoto(){
    showPhoto(currentIndex - 1);
}

function startSlideshow(){

    if(slideshowRunning){
        return;
    }

    slideshowRunning = true;

    slideshowIcon.textContent = "⏸";

    slideshowBtn.title = "Pause Slideshow";

    slideshowTimer = setInterval(
        nextPhoto,
        slideshowDelay
    );
}

function stopSlideshow(){

    slideshowRunning = false;

    clearInterval(slideshowTimer);

    slideshowTimer = null;

    slideshowIcon.textContent = "▶";

    slideshowBtn.title = "Start Slideshow";
}

function toggleSlideshow(){

    if(slideshowRunning){
        stopSlideshow();
    }
    else{
        startSlideshow();
    }
}

document
    .getElementById("nextBtn")
    .addEventListener("click", nextPhoto);

document
    .getElementById("prevBtn")
    .addEventListener("click", previousPhoto);

slideshowBtn.addEventListener(
    "click",
    toggleSlideshow
);

document.addEventListener("keydown", function(e){

    switch(e.key){

        case "ArrowRight":
            nextPhoto();
            break;

        case "ArrowLeft":
            previousPhoto();
            break;

        case "s":
        case "S":
            toggleSlideshow();
            break;

        case " ":
            e.preventDefault();
            toggleSlideshow();
            break;

        case "Home":
            showPhoto(0);
            break;

        case "End":
            showPhoto(photos.length - 1);
            break;
    }

});

showPhoto(0);

</script>

</body>
</html>
